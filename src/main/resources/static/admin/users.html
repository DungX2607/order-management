<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý tài khoản - Admin</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="header">
        <h1>🥤 Quản lý Tài khoản - Admin</h1>
        <div class="header-actions">
            <span class="user-info" id="userInfo"></span>
            <button onclick="logout()" class="btn-secondary">Đăng xuất</button>
        </div>
    </div>
    
    <div class="nav">
        <ul>
            <li><a href="/admin/dashboard.html">Quản lý đơn</a></li>
            <li><a href="/admin/menu.html">Quản lý menu</a></li>
            <li><a href="/admin/users.html">Quản lý tài khoản</a></li>
        </ul>
    </div>
    
    <div class="container">
        <!-- Add User -->
        <div class="card">
            <h2>Thêm thành viên mới</h2>
            <form id="userForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="username">Tên đăng nhập</label>
                        <input type="text" id="username" required 
                               placeholder="Ví dụ: nguyen.van.a">
                    </div>
                    <div class="form-group">
                        <label for="fullName">Họ và tên</label>
                        <input type="text" id="fullName" required 
                               placeholder="Ví dụ: Nguyễn Văn A">
                    </div>
                </div>
                <button type="submit">Thêm thành viên</button>
                <p style="margin-top: 1rem; color: #666; font-size: 0.9rem;">
                    ℹ️ Mật khẩu mặc định: <strong>123456aA@</strong>
                </p>
            </form>
        </div>
        
        <!-- Users List -->
        <div class="card">
            <h2>Danh sách thành viên</h2>
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Đang tải...</p>
            </div>
            <div id="usersContainer"></div>
        </div>
    </div>
    
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/admin-users.js"></script>
</body>
</html>
