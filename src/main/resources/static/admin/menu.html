<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý menu - Admin</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="header">
        <h1>🥤 Quản lý Menu - Admin</h1>
        <div class="header-actions">
            <span class="user-info" id="userInfo"></span>
            <button onclick="logout()" class="btn-secondary">Đăng xuất</button>
        </div>
    </div>
    
    <div class="nav">
        <ul>
            <li><a href="/admin/dashboard.html">Quản lý đơn</a></li>
            <li><a href="/admin/menu.html">Quản lý menu</a></li>
            <li><a href="/admin/users.html">Quản lý tài khoản</a></li>
        </ul>
    </div>
    
    <div class="container">
        <!-- Add Category -->
        <div class="card">
            <h2>Thêm danh mục mới</h2>
            <form id="categoryForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="categoryName">Tên danh mục</label>
                        <input type="text" id="categoryName" required 
                               placeholder="Ví dụ: Highland Coffee">
                    </div>
                    <div class="form-group">
                        <label for="categoryOrder">Thứ tự hiển thị</label>
                        <input type="number" id="categoryOrder" value="0" required>
                    </div>
                </div>
                <button type="submit">Thêm danh mục</button>
            </form>
        </div>
        
        <!-- Add Menu Item -->
        <div class="card">
            <h2>Thêm món đồ uống</h2>
            <form id="menuItemForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="itemCategory">Danh mục</label>
                        <select id="itemCategory" required>
                            <option value="">-- Chọn danh mục --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="itemName">Tên món</label>
                        <input type="text" id="itemName" required 
                               placeholder="Ví dụ: Trà sữa trân châu">
                    </div>
                    <div class="form-group">
                        <label for="itemOrder">Thứ tự</label>
                        <input type="number" id="itemOrder" value="0" required>
                    </div>
                </div>
                <button type="submit">Thêm món</button>
            </form>
        </div>
        
        <!-- Menu List -->
        <div class="card">
            <h2>Danh sách menu</h2>
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Đang tải...</p>
            </div>
            <div id="menuContainer"></div>
        </div>
    </div>
    
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/admin-menu.js"></script>
</body>
</html>
