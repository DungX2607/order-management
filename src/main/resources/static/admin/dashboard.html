<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý đơn hàng - Admin</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="header">
        <h1>🥤 Quản lý Đặt Nước - Admin</h1>
        <div class="header-actions">
            <span class="user-info" id="userInfo"></span>
            <button onclick="logout()" class="btn-secondary">Đăng xuất</button>
        </div>
    </div>
    
    <div class="nav">
        <ul>
            <li><a href="/admin/dashboard.html">Quản lý đơn</a></li>
            <li><a href="/admin/menu.html">Quản lý menu</a></li>
            <li><a href="/admin/users.html">Quản lý tài khoản</a></li>
        </ul>
    </div>
    
    <div class="container">
        <!-- Cycle Control -->
        <div class="card">
            <h2>Điều khiển chu kỳ</h2>
            <div id="cycleStatus" style="margin-bottom: 1rem;"></div>
            <div style="display: flex; gap: 1rem;">
                <button id="openCycleBtn" onclick="openCycle()">Mở chu kỳ</button>
                <button id="closeCycleBtn" onclick="closeCycle()" class="btn-danger">Đóng chu kỳ</button>
            </div>
        </div>
        
        <!-- Statistics -->
        <div class="card">
            <h2>Thống kê</h2>
            <div class="statistics">
                <div class="stat-card">
                    <div class="number" id="totalOrders">0</div>
                    <div class="label">Tổng đơn</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="pickedOrders">0</div>
                    <div class="label">Đã lấy</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="unpickedOrders">0</div>
                    <div class="label">Chưa lấy</div>
                </div>
            </div>
        </div>
        
        <!-- Orders List -->
        <div class="card">
            <h2>Danh sách đơn hàng</h2>
            
            <!-- Filters -->
            <div class="filter-bar">
                <select id="statusFilter" onchange="loadOrders()">
                    <option value="">Tất cả trạng thái</option>
                    <option value="picked">Đã lấy</option>
                    <option value="unpicked">Chưa lấy</option>
                </select>
                
                <input type="text" id="searchInput" placeholder="Tìm kiếm theo tên thành viên..." 
                       onkeyup="handleSearch()">
                
                <button onclick="exportExcel()">📥 Xuất Excel</button>
            </div>
            
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Đang tải...</p>
            </div>
            
            <div id="ordersContainer"></div>
        </div>
    </div>
    
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/admin-dashboard.js"></script>
</body>
</html>
