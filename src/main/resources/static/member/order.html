<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt nước - Hệ thống Đặt Nước</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="header">
        <h1>🥤 Đặt Nước</h1>
        <div class="header-actions">
            <span class="user-info" id="userInfo"></span>
            <button onclick="logout()" class="btn-secondary">Đăng xuất</button>
        </div>
    </div>
    
    <div class="container">
        <!-- Cycle Status -->
        <div class="card">
            <h2>Trạng thái chu kỳ</h2>
            <div id="cycleStatus"></div>
        </div>
        
        <!-- Order Form -->
        <div class="card">
            <h2>Đơn đặt nước của bạn</h2>
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Đang tải...</p>
            </div>
            
            <form id="orderForm">
                <div id="menu"></div>
                
                <div class="form-group">
                    <label for="note">Ghi chú (tùy chọn)</label>
                    <textarea id="note" placeholder="Ví dụ: ít đá, nhiều đường..."></textarea>
                </div>
                
                <button type="submit" id="submitBtn">Đặt hàng</button>
            </form>
        </div>
    </div>
    
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/order.js"></script>
</body>
</html>
